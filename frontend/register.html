<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Schedule System - Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🏥 Clinic Schedule</h1>
                <p>Создать новый аккаунт</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required placeholder="3-32 символа (a-z, 0-9, _)">
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Минимум 6 символов">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Подтвердите пароль</label>
                    <input type="password" id="password_confirm" name="password_confirm" required placeholder="Повторите пароль">
                    <span class="error-message" id="passwordConfirmError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                <span class="error-message" id="formError"></span>
                <span class="success-message" id="formSuccess"></span>
            </form>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="login.html">Войдите</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            
            // Очистка ошибок
            document.getElementById('formError').textContent = '';
            document.getElementById('formSuccess').textContent = '';
            
            // Валидация
            if (password !== password_confirm) {
                document.getElementById('passwordConfirmError').textContent = 'Пароли не совпадают';
                return;
            }
            
            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Пароль должен быть минимум 6 символов';
                return;
            }
            
            try {
                const response = await fetch('/backend/api/register.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('formSuccess').textContent = data.message;
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    document.getElementById('formError').textContent = data.error || 'Ошибка регистрации';
                }
            } catch (error) {
                document.getElementById('formError').textContent = 'Ошибка соединения';
                console.error('Register error:', error);
            }
        });
    </script>
</body>
</html>
